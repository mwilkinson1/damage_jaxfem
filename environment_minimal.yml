# Minimal env for jax-fem: only key deps so conda can resolve without channel conflicts.
# Use: conda env create -f environment_minimal.yml
name: test_env
channels:
  - conda-forge
dependencies:
  - python=3.9
  - fenics=2019.1.0
  - meshio
  - numpy
  - scipy
  - matplotlib
  - pandas
  - pip
  - pip:
    - jax==0.4.30
    - jaxlib==0.4.30
    - jax-fem==0.0.8
    - gmsh==4.11.1
    - fenics-basix==0.6.0
    - pyfiglet==1.0.0
    - pymupdf>=1.26.0
