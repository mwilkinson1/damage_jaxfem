[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxfem-gradient-damage"
version = "0.1.0"
description = "Gradient-enhanced continuum damage models for JAX-FEM"
requires-python = ">=3.9"
dependencies = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "jax-fem==0.0.8",
    "meshio",
    "numpy",
]

[project.optional-dependencies]
plot = ["matplotlib", "pillow"]
test = ["pytest>=7", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: small finite-element integration tests",
    "regression: numerical trend and paper-result checks",
    "slow: tests excluded from the default bounded test run",
]

[tool.pyright]
extraPaths = ["src"]
